<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aether Doc AI · MVP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" rel="stylesheet">
<style>
:root{--bg:#faf8ff;--sf:#fff;--sf2:#f2f3ff;--sf3:#eaedff;--tx:#131b2e;--mu:#434655;--ln:#c3c6d7;--pr:#004ac6;--pc:#2563eb;--hl:#dbe1ff;--ok:#4CAF50;--info:#2196F3;--er:#F44336;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1424;--sf:#1a2136;--sf2:#20283f;--sf3:#283150;--tx:#eef0ff;--mu:#b4bdd8;--ln:#3a4466;--pr:#b4c5ff;--hl:#26407f}}
:root[data-theme="dark"]{--bg:#0f1424;--sf:#1a2136;--sf2:#20283f;--sf3:#283150;--tx:#eef0ff;--mu:#b4bdd8;--ln:#3a4466;--pr:#b4c5ff;--hl:#26407f}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 'Plus Jakarta Sans','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pc);outline-offset:2px}
.material-symbols-outlined{font-size:24px;line-height:1;vertical-align:middle;font-variation-settings:'FILL' 0}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
#app.wide{max-width:1180px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.hd h1{font-size:24px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--pc);color:#fff;display:grid;place-items:center}
.scroll{flex:1;overflow:auto;padding:4px 20px 110px}
.sec{font-size:17px;font-weight:600;margin:18px 0 10px}
.mu{color:var(--mu)}.note{margin:0 20px 8px;padding:8px 12px;border-radius:12px;background:var(--sf3);color:var(--mu);font-size:12px}
.srch{display:flex;align-items:center;gap:8px;margin:4px 20px;padding:0 16px;height:48px;border-radius:24px;background:var(--sf);border:1px solid var(--ln)}
.srch input{flex:1;border:0;background:none;outline:0;height:44px}
select{height:44px;border-radius:22px;border:1px solid var(--ln);background:var(--sf);padding:0 14px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sf);border-radius:20px;box-shadow:0 2px 10px rgba(0,74,198,.08);border:1px solid var(--sf3)}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%;min-height:72px}
.pdf{flex:none;width:44px;height:48px;border-radius:10px;background:#ef5350;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.inf{flex:1;min-width:0;display:flex;flex-direction:column}.inf b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inf small{color:var(--mu)}
.ico{display:grid;place-items:center}.ico .material-symbols-outlined{font-size:28px;font-variation-settings:'FILL' 1}.ok{color:var(--ok)}.er{color:var(--er)}
.spin{width:24px;height:24px;border:3px solid #2196F333;border-top-color:var(--info);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes bl{50%{opacity:0}}
.fab{position:absolute;right:20px;bottom:92px;width:56px;height:56px;border-radius:20px;background:var(--pc);color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.4);display:grid;place-items:center;z-index:100}
.nav{flex:none;display:flex;gap:6px;padding:8px 16px 10px;background:var(--sf);border-top:1px solid var(--sf3);z-index:100}
.nav button{flex:1;min-height:52px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mu)}
.nav .on{background:var(--hl);color:var(--pr);font-weight:700}
.top{display:flex;align-items:center;gap:8px;padding:12px 12px 4px}.tt{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.ib:disabled{opacity:.35}
.seg{display:flex;gap:4px;padding:4px;margin:6px 20px 12px;border-radius:24px;background:var(--sf3)}
.seg button{flex:1;min-height:40px;border-radius:20px;color:var(--mu);font-weight:500}.seg .on{background:var(--pc);color:#fff;font-weight:700}
.pane .seg{margin:0 0 12px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px}
.wide .main{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}.wide .seg{margin-left:0;margin-right:0}
.pane{min-height:0;overflow:auto;flex:1;padding-bottom:16px}.side{display:flex;flex-direction:column}
.pad{padding:18px;line-height:1.8}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:0 18px;text-align:left;border-bottom:1px solid var(--sf3)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:44px;padding:0 18px;border-radius:22px;background:var(--sf3);color:var(--pr);font-weight:600}.chip.sm{min-height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:4px;background:var(--sf);border:1px solid var(--ln)}.chip.sm .material-symbols-outlined{font-size:18px}
.chat{display:flex;flex-direction:column;flex:1;min-height:0}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 0}
.u{align-self:flex-end;max-width:85%;background:var(--pc);color:#fff;padding:10px 16px;border-radius:20px 20px 4px 20px}
.a{align-self:flex-start;max-width:92%}.bub{background:var(--sf);border:1px solid var(--sf3);padding:12px 16px;border-radius:20px 20px 20px 4px;line-height:1.7}
.src{display:flex;gap:8px;margin-top:8px}.warn{margin-top:6px;font-size:12px;color:var(--er)}
.cur{display:inline-block;width:6px;height:14px;background:var(--pc);animation:bl 1s steps(2) infinite;vertical-align:-2px;margin-left:2px}
.hello{margin:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--mu)}.hello .chips{justify-content:center}
.inp{flex:none;display:flex;gap:8px;padding:10px 0 4px}.inp input{flex:1;height:48px;border-radius:24px;border:1px solid var(--ln);background:var(--sf);padding:0 18px}
.send{width:48px;height:48px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.cite{border-left:5px solid var(--pc);background:var(--sf);border-radius:16px;padding:12px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,74,198,.08)}
.cite b{color:var(--pr)}.cite small{display:block;color:var(--mu);margin-bottom:4px}.cite p{font-size:13px;color:var(--mu)}
.paper{background:var(--sf);border-radius:20px;padding:20px;border:1px solid var(--sf3)}
.paper .fn{font-size:12px;color:var(--mu);margin-bottom:14px}.paper .sc{font-size:12px;font-weight:700;color:var(--pr)}
.paper h2{font-size:22px;line-height:1.35;margin:6px 0 12px;letter-spacing:-.02em}.paper p{margin-bottom:12px;color:var(--mu)}
.key{background:var(--sf2);border-radius:20px;padding:16px;margin:14px 0;position:relative}.key em{font-style:normal;display:block;margin-top:10px;font-size:12px;font-weight:700;color:var(--pr)}
mark{background:#FFF176;color:#131b2e;padding:1px 3px;border-radius:4px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin:10px 0}.bars i{flex:1;background:var(--hl);border-radius:6px 6px 0 0;position:relative;font-style:normal}.bars i:last-child{background:var(--pc)}
.bars span{position:absolute;top:-18px;width:100%;text-align:center;font-size:11px;color:var(--mu)}
.pf{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:16px}
.bar{position:sticky;bottom:8px;display:flex;gap:8px;justify-content:center;margin-top:14px}
.btn{min-height:48px;padding:0 20px;border-radius:24px;background:var(--pc);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.btn.sec{background:var(--hl);color:var(--pr);box-shadow:none}.btn.danger{background:var(--er)}
.ov{position:absolute;inset:0;background:rgba(10,15,40,.5);z-index:500}
.sheet{position:absolute;left:0;right:0;bottom:0;height:60%;background:var(--bg);border-radius:28px 28px 0 0;z-index:501;display:flex;flex-direction:column;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.hnd{width:40px;height:4px;border-radius:2px;background:var(--ln);margin:10px auto 0}.sh{display:flex;justify-content:space-between;align-items:center;padding:4px 12px 4px 20px}.sb{flex:1;overflow:auto;padding:4px 20px 16px}.sb .btn{width:100%;margin-top:12px}
.mo{position:fixed;inset:0;background:rgba(10,15,40,.5);display:grid;place-items:center;z-index:1000;padding:20px}
.dlg{background:var(--sf);border-radius:24px;padding:24px;width:100%;max-width:360px}.dlg h3{font-size:18px;margin-bottom:8px}.dlg p{color:var(--mu);margin-bottom:18px;word-break:break-all}.acts{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:24px;z-index:2000;max-width:90%;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms=n=>`<span class="material-symbols-outlined" aria-hidden="true">${n}</span>`;
const P=[
{sc:'EXECUTIVE SUMMARY',t:'온디바이스 AI와 반도체 시장 개요',p:'스마트폰, PC, 모빌리티 등 엣지 디바이스가 AI 연산을 직접 수행하는 온디바이스 AI가 빠르게 확산되고 있다. 본 보고서는 2024~2028년 시장 전망과 반도체 수요 변화를 분석한다.',k:'본 보고서는 온디바이스 AI 확산이 NPU·메모리 등 반도체 수요 구조에 미치는 영향을 2028년까지 전망한다.'},
{sc:'CHAPTER 3.2 | EMERGING TECH & EDGE COMPUTING',t:'온디바이스 AI 가속기 및 반도체 수요 전망',p:'엣지 디바이스 내 NPU(신경망 처리장치) 탑재율이 급증하면서 저전력 연산 아키텍처의 중요성이 부각되고 있다.',k:'2024~2028년 온디바이스 AI 칩셋 출하량 기준 연평균 성장률(CAGR)은 28.5%로 전망되며, 프리미엄 스마트폰의 기본 채택률은 2026년을 기점으로 70%를 상회할 것으로 예측된다.',c:[214,286,392,498,590]},
{sc:'CHAPTER 4.1 | PRIVACY & SECURITY',t:'개인정보 보호와 보안',p:'민감 데이터를 서버로 보내지 않는 처리 방식에 대한 수요가 커지고 있다.',k:'온디바이스 처리는 민감한 데이터를 기기 밖으로 전송하지 않아 개인정보 보호 요구와 네트워크 지연 문제를 동시에 줄일 수 있다.'},
{sc:'CHAPTER 5.2 | FOUNDRY & POWER',t:'파운드리 공정과 전력 효율',p:'선단 공정 전환은 NPU 경쟁력의 핵심 변수다.',k:'3nm 이하 선단 공정 도입으로 NPU의 와트당 연산 성능이 크게 개선되지만, 공정 수율 안정화가 선행되어야 한다.'},
{sc:'CHAPTER 6.1 | COST STRUCTURE',t:'원가 구조와 가격 전망',p:'고성능 NPU 탑재는 단기적으로 단가 상승 요인이다.',k:'고성능 NPU 탑재로 부품 단가(BoM)는 상승하지만, 2026년 하반기 이후 양산 규모 확대와 수율 개선으로 원가 효율이 본격화될 것으로 관측된다.'},
{sc:'CHAPTER 7 | RISK & CONCLUSION',t:'리스크와 결론',p:'공급망과 규제 환경을 함께 고려해야 한다.',k:'주요 리스크는 선단 공정 공급 부족, 소프트웨어 생태계 파편화, 규제 변화이며, 장기적으로 온디바이스와 클라우드 AI의 하이브리드 구조가 표준이 될 전망이다.'}];
const SUM='본 문서는 온디바이스 AI 확산에 따른 반도체 수요를 분석한 시장 보고서입니다. 2024~2028년 칩셋 출하량의 연평균 성장률(CAGR)은 28.5%로 전망되며, 개인정보 보호와 전력 효율이 핵심 동인으로 제시됩니다. 원가 효율은 2026년 하반기 이후 본격화될 것으로 보고, 공급 부족과 규제 변화를 주요 리스크로 짚습니다.';
const TOC=[['1. 시장 개요',1],['2. 온디바이스 AI 가속기 수요 전망',2],['3. 개인정보 보호와 보안',3],['4. 파운드리 공정과 전력 효율',4],['5. 원가 구조와 가격 전망',5],['6. 리스크와 결론',6]];
const KW=['온디바이스 AI','NPU','CAGR','개인정보 보호','파운드리','전력 효율','BoM 가격','리스크'];
const SUG=['이 문서의 핵심 내용은?','CAGR 전망은?','보안 이슈는 무엇인가요?','가격 동향을 알려줘'];
const QA=[
{m:['온디바이스 ai'],a:'온디바이스 AI는 클라우드 대신 기기 내부의 NPU에서 AI 연산을 수행하는 방식입니다. 이 문서는 저전력 연산, 개인정보 보호, 응답 지연 감소를 확산 동인으로 설명합니다.',s:[1,3]},
{m:['cagr','성장률','출하량','npu'],a:'2024~2028년 온디바이스 AI 칩셋 출하량의 연평균 성장률(CAGR)은 28.5%로 전망됩니다. 프리미엄 스마트폰의 기본 채택률은 2026년 이후 70%를 넘을 것으로 예측됩니다.',s:[2]},
{m:['보안','개인정보','프라이버시'],a:'온디바이스 처리는 민감한 데이터를 기기 밖으로 보내지 않아 개인정보 보호 요구와 네트워크 지연 문제를 함께 줄일 수 있다고 설명합니다.',s:[3]},
{m:['파운드리','공정','전력'],a:'3nm 이하 선단 공정으로 NPU의 와트당 연산 성능이 크게 개선되지만, 공정 수율 안정화가 먼저 필요하다고 봅니다.',s:[4]},
{m:['가격','비용','원가','bom'],a:'NPU 탑재로 부품 단가(BoM)는 오르지만, 2026년 하반기 이후 양산 확대와 수율 개선으로 원가 효율이 본격화될 것으로 전망합니다.',s:[5]},
{m:['리스크','위험','결론','하이브리드'],a:'주요 리스크는 선단 공정 공급 부족, 소프트웨어 생태계 파편화, 규제 변화입니다. 장기적으로는 온디바이스와 클라우드 AI의 하이브리드 구조가 표준이 될 전망입니다.',s:[6]},
{m:['핵심','요약','내용'],a:'이 보고서는 온디바이스 AI 확산에 따른 반도체 수요를 분석합니다. CAGR 28.5% 성장, 개인정보 보호·전력 효율 중심의 수요, 2026년 하반기 이후 원가 효율 개선이 주요 내용입니다.',s:[2,3,5]}];
const today=()=>{const t=new Date();return t.getFullYear()+'.'+String(t.getMonth()+1).padStart(2,'0')+'.'+String(t.getDate()).padStart(2,'0')};
let docs=[{id:1,name:'2024_Semiconductor_Outlook_KR.pdf',date:'2026.10.12',mb:2.4,st:'ok'},{id:2,name:'계약서_초안.pdf',date:'2026.10.11',mb:1.8,st:'prog'},{id:3,name:'분기보고서.pdf',date:'2026.10.10',mb:2.9,st:'fail'}];
let chats={},seq=4,last=1,S={v:'home',tab:'an',sub:'sum',sort:'new',id:1,page:2,hl:false,sheet:0,draft:'',q:''};
const wide=()=>matchMedia('(min-width:900px)').matches;
const stat=s=>s==='prog'?'<span class="spin" role="img" aria-label="분석 중"></span>':s==='ok'?`<span class="ico ok" role="img" aria-label="분석 완료">${ms('check_circle')}</span>`:`<span class="ico er" role="img" aria-label="분석 실패">${ms('error')}</span>`;
const card=d=>`<button class="card item" onclick="openDoc(${d.id})"><span class="pdf">PDF</span><span class="inf"><b>${esc(d.name)}</b><small>${d.date} · ${d.mb}MB</small></span>${stat(d.st)}</button>`;
function cards(){let d=docs.filter(x=>x.name.toLowerCase().includes(S.q.toLowerCase()));
 d=S.v==='home'?[...d].sort((a,b)=>b.id-a.id).slice(0,3):[...d].sort(S.sort==='name'?(a,b)=>a.name.localeCompare(b.name,'ko'):S.sort==='size'?(a,b)=>b.mb-a.mb:(a,b)=>b.id-a.id);
 return d.map(card).join('')||'<p class="mu">문서가 없습니다.</p>'}
function filt(v){S.q=v;$('.cards').innerHTML=cards()}
function nav(){return `<nav class="nav">${[['home','홈','home'],['docs','내 문서','description'],['chat','AI 대화','forum']].map(([k,l,i])=>`<button class="${S.v===k?'on':''}" onclick="nv('${k}')">${ms(i)}${l}</button>`).join('')}</nav>`}
function list(){const h=S.v==='home';
 return `<header class="hd"><h1><span class="logo">${ms('description')}</span>${h?'홈':'내 문서'}</h1>${h?'':`<select aria-label="정렬" onchange="S.sort=this.value;render()">${[['new','최신순'],['name','이름순'],['size','용량순']].map(([k,l])=>`<option value="${k}" ${S.sort===k?'selected':''}>${l}</option>`).join('')}</select>`}</header>
 <p class="note">MVP 시연: 업로드한 문서도 샘플 분석 결과가 표시됩니다.</p>
 ${h?`<div class="srch">${ms('search')}<input placeholder="문서를 검색하세요" aria-label="문서 검색" value="${esc(S.q)}" oninput="filt(this.value)"></div>`:''}
 <div class="scroll">${h?'<h2 class="sec">최근 분석 문서</h2>':''}<div class="cards">${cards()}</div></div>
 <button class="fab" onclick="$('#f').click()" aria-label="PDF 업로드">${ms('add')}</button><input id="f" type="file" accept=".pdf,application/pdf" hidden onchange="upload(this)">${nav()}`}
function pageHTML(n,hl){const p=P[n-1];
 return `${hl?`<div class="cite"><b>인용 위치 · 출처 p.${n}</b><small>형광펜 하이라이트 매칭됨</small><p>“…${esc(p.k.slice(0,44))}…”</p></div>`:''}
 <article class="paper"><div class="fn">2024_Semiconductor_Outlook_KR.pdf</div><div class="sc">${esc(p.sc)}</div><h2>${esc(p.t)}</h2><p>${esc(p.p)}</p>
 <div class="key">${hl?`<mark>${esc(p.k)}</mark>`:esc(p.k)}${hl?'<em>AI 답변 생성에 직접 사용된 핵심 근거 문장</em>':''}</div>
 ${p.c?`<div class="bars" role="img" aria-label="NPU 출하량 추이">${p.c.map((v,i)=>`<i style="height:${v/590*100}%"><span>${v}</span></i>`).join('')}</div><p style="font-size:12px">[도표 3-4] 글로벌 NPU 출하량 추이 (2024~2028F, 백만 대)</p>`:''}
 <div class="pf"><span>Tech Insights Research Group</span><span>${n}</span></div></article>`}
function pdfHTML(){const n=S.page;
 return `<div class="pager"><button class="ib" onclick="pg(-1)" ${n<2?'disabled':''} aria-label="이전 페이지">${ms('chevron_left')}</button><b>${n} / ${P.length}</b><button class="ib" onclick="pg(1)" ${n>=P.length?'disabled':''} aria-label="다음 페이지">${ms('chevron_right')}</button></div>${pageHTML(n,S.hl)}
 <div class="bar"><button class="btn sec" onclick="S.tab='chat';render()">${ms('forum')}답변 채팅 복귀</button><button class="btn" onclick="askPage(${n})">${ms('help')}이 페이지 질의</button></div>`}
function an(){return `<div class="seg">${[['sum','요약'],['toc','목차'],['kw','키워드']].map(([k,l])=>`<button class="${S.sub===k?'on':''}" onclick="S.sub='${k}';render()">${l}</button>`).join('')}</div>`+
 (S.sub==='sum'?`<div class="card pad">${SUM}</div>`:S.sub==='toc'?`<div class="card">${TOC.map(([t,p])=>`<button class="row" onclick="S.page=${p};S.hl=false;S.tab=wide()?'an':'pdf';render()"><span>${esc(t)}</span><span class="mu">p.${p}</span></button>`).join('')}</div>`:`<div class="chips">${KW.map(k=>`<button class="chip" onclick="kw('${k}')">${esc(k)}</button>`).join('')}</div>`)}
function chatHTML(){return `<div class="chat"><div class="msgs" id="m"></div><div class="inp"><input id="q" maxlength="300" placeholder="질문을 입력하세요" aria-label="질문 입력" value="${esc(S.draft)}" oninput="S.draft=this.value" onkeydown="if(event.key==='Enter')ask()"><button class="send" onclick="ask()" aria-label="전송">${ms('send')}</button></div></div>`}
const msg=x=>x.r==='u'?`<div class="u">${esc(x.t)}</div>`:`<div class="a"><div class="bub" ${x.busy?'id="live"':''}><span>${esc(x.t)}</span>${x.busy?'<i class="cur"></i>':''}</div>${x.s.length?`<div class="src">${x.s.map(n=>`<button class="chip sm" onclick="cite(${n})" aria-label="출처 ${n}페이지">${ms('description')}p.${n}</button>`).join('')}</div>`:''}${x.none?'<p class="warn">문서 내 명확한 근거를 찾지 못했습니다.</p>':''}</div>`;
function paintChat(){const m=$('#m');if(!m)return;const c=chats[S.id]||[];
 m.innerHTML=c.length?c.map(msg).join(''):`<div class="hello">${ms('auto_awesome')}<p>문서에 대해 무엇이든 물어보세요.</p><div class="chips">${SUG.map(s=>`<button class="chip" onclick="send(this.textContent)">${esc(s)}</button>`).join('')}</div></div>`;m.scrollTop=m.scrollHeight}
function sheet(){return `<div class="ov" onclick="S.sheet=0;render()"></div><div class="sheet" role="dialog" aria-label="출처 원문"><i class="hnd"></i><div class="sh"><b>${ms('picture_as_pdf')} p.${S.sheet}</b><button class="ib" onclick="S.sheet=0;render()" aria-label="닫기">${ms('close')}</button></div><div class="sb">${pageHTML(S.sheet,true)}<button class="btn" onclick="S.sheet=0;S.tab='pdf';render()">PDF에서 보기</button></div></div>`}
function detail(){const d=docs.find(x=>x.id===S.id)||{name:''},w=wide();if(w&&S.tab==='pdf')S.tab='an';
 const tabs=[['an','분석'],['chat','AI 대화'],...(w?[]:[['pdf','PDF']])];
 return `<header class="top"><button class="ib" onclick="S.v='docs';render()" aria-label="뒤로">${ms('arrow_back')}</button><div class="tt">${esc(d.name)}</div></header>
 ${d.up?'<p class="note">MVP 시연: 업로드한 문서도 샘플 분석 결과가 표시됩니다.</p>':''}
 ${w?'':`<div class="seg">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div>`}
 <div class="main">${w?`<section class="pane">${pdfHTML()}</section>`:''}<section class="pane side">${w?`<div class="seg">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div>`:''}${S.tab==='an'?an():S.tab==='chat'?chatHTML():pdfHTML()}</section></div>${!w&&S.sheet?sheet():''}`}
function render(){const a=$('#app');a.className=S.v==='detail'&&wide()?'wide':'';a.innerHTML=S.v==='detail'?detail():list();if(S.v==='detail'&&S.tab==='chat')paintChat()}
function pg(d){S.page+=d;S.hl=false;render()}
function cite(n){S.page=n;S.hl=true;if(!wide())S.sheet=n;render()}
function kw(k){S.tab='chat';render();send(`이 문서에서 ${k}에 대해 설명해줘`)}
function askPage(n){S.tab='chat';render();send(`p.${n}의 내용을 설명해줘`)}
function ask(){const i=$('#q'),v=i.value.trim();if(!v)return;S.draft='';i.value='';send(v)}
function answer(t){const l=t.toLowerCase(),m=l.match(/p\.(\d+)/);if(m&&P[m[1]-1])return{a:`p.${m[1]}의 핵심 내용입니다. ${P[m[1]-1].k}`,s:[+m[1]]};
 const h=QA.find(q=>q.m.some(k=>l.includes(k)));return h?{a:h.a,s:h.s}:{a:'질문과 관련된 내용을 이 문서에서 찾지 못했습니다. 다른 표현으로 질문하거나 키워드 탭의 항목을 선택해 보세요.',s:[],none:1}}
function send(t){const c=chats[S.id]=chats[S.id]||[];c.push({r:'u',t});const r=answer(t),m={r:'a',t:'',s:[],busy:1};c.push(m);paintChat();let i=0;
 const iv=setInterval(()=>{i+=2;m.t=r.a.slice(0,i);const e=$('#live'),mm=$('#m');if(e)e.firstChild.textContent=m.t;if(mm)mm.scrollTop=mm.scrollHeight;
 if(i>=r.a.length){clearInterval(iv);m.t=r.a;m.busy=0;m.s=r.s;m.none=r.none;if(S.tab==='chat'&&S.v==='detail')paintChat()}},28)}
function modal(t,m,b=[['확인']]){const o=document.createElement('div');o.className='mo';o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h3>${esc(t)}</h3><p>${esc(m)}</p><div class="acts"></div></div>`;
 b.forEach(([l,f,c])=>{const e=document.createElement('button');e.className='btn '+(c||'');e.textContent=l;e.onclick=()=>{o.remove();f&&f()};o.querySelector('.acts').append(e)});document.body.append(o)}
function toast(m){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2400)}
function done(id){const d=docs.find(x=>x.id===id);if(d){d.st='ok';if(S.v!=='detail')render()}}
function upload(i){const f=i.files[0];i.value='';if(!f)return;
 if(!/\.pdf$/i.test(f.name))return modal('PDF 파일만 업로드할 수 있습니다','.pdf 형식의 파일을 선택해 주세요.');
 if(f.size>52428800)return modal('파일 용량 초과','단일 파일은 최대 50MB까지 업로드할 수 있습니다.');
 const d={id:seq++,name:f.name,date:today(),mb:Math.max(.1,+(f.size/1048576).toFixed(1)),st:'prog',up:1};docs.push(d);toast('업로드 완료. 분석을 시작합니다.');render();setTimeout(()=>done(d.id),3500)}
function openDoc(id){const d=docs.find(x=>x.id===id);
 if(d.st==='prog')return toast('문서를 분석하고 있어요. 잠시만 기다려 주세요.');
 if(d.st==='fail')return modal('분석에 실패했습니다',d.name,[['문서 삭제',()=>modal('삭제할까요?','삭제된 데이터는 복구할 수 없습니다.',[['취소',0,'sec'],['삭제',()=>{docs=docs.filter(x=>x.id!==id);delete chats[id];render()},'danger']]),'sec'],['재분석 시도',()=>{d.st='prog';render();setTimeout(()=>done(id),2500)}]]);
 Object.assign(S,{v:'detail',id,tab:'an',sub:'sum',page:2,hl:false,sheet:0});last=id;render()}
function nv(v){if(v==='chat'){const d=docs.find(x=>x.id===last&&x.st==='ok')||docs.find(x=>x.st==='ok');if(!d)return toast('분석 완료된 문서가 없습니다.');Object.assign(S,{v:'detail',id:d.id,tab:'chat',sheet:0})}else S.v=v;render()}
matchMedia('(min-width:900px)').addEventListener('change',render);
setTimeout(()=>done(2),6000);render();
</script>
</body>
</html>
