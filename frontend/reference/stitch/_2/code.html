<div class="relative w-28 h-28 rounded-3xl bg-surface-container-lowest shadow-xl shadow-primary/10 flex items-center justify-center p-2">
<img alt="DocuAI Logo" class="w-full h-full object-contain drop-shadow-sm rounded-2xl" src="https://lh3.googleusercontent.com/aida/AEtjO1UdS6l-X7pthLvBwdly8oyng7bM-Obl6IrY5YBtMDrgoqCQyEda8Ph1Y3b6RXIqZcMn_kAWaQpyPGUuyUI-HBAjXdR8P28035JyDOr_b1srnSbg97v8yT5BduHpfKi6zvwnxTbJo-YFxkZb7ejN2nFOUbO22fr2-tsl_fmk0JKY_w5NiicQ-aDZ2yNKQ17LUukonhKEHXde7fXo2kRSiH4KrdtPf8sfO8MCdOrpyWcpvrCvY_Ibr8aX_Cg"/>

<span class="material-symbols-outlined text-[15px] leading-none" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</div>
<!-- App Identity & Human Touch Slogan -->

      DocuAI
    </h1>
<div class="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-container-high/70 rounded-full mb-space-sm shadow-sm">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-primary font-semibold tracking-wide">스마트 인텔리전트 도큐먼트 리더</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[260px] leading-relaxed">
      복잡한 문서를 AI로 쉽고 빠르게<br/>요약하고 분석해 보세요
    </p>
</div>
<!-- Interactive Action Section -->
<div class="relative z-10 flex flex-col w-full pb-space-lg">
<!-- Social Login Buttons Group -->
<div class="flex flex-col gap-3 w-full">
<!-- Google Auth Pill Button -->
<button class="w-full h-14 bg-surface-container-lowest text-on-surface rounded-full shadow-sm hover:shadow-md active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-3 px-6 cursor-pointer" id="googleLoginBtn" type="button">
<svg class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-title-md text-title-md font-medium tracking-tight">Google로 로그인</span>
</button>
<!-- Apple Auth Pill Button -->
<button class="w-full h-14 bg-inverse-surface text-inverse-on-surface rounded-full shadow-sm hover:shadow-md active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2.5 px-6 cursor-pointer" id="appleLoginBtn" type="button">
<svg class="w-5 h-5 flex-shrink-0 fill-current mb-0.5" viewbox="0 0 170 170">
<path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.08-7.83-7.97-12.43-14.68-6.42-9.35-11.45-20.04-15.08-32.07-3.63-12.04-5.45-23.36-5.45-33.97 0-14.72 3.8-27.04 11.41-36.96 7.61-9.92 17.2-15.01 28.77-15.28 5.54 0 11.39 1.5 17.56 4.5 6.17 3 10.15 4.56 11.95 4.67 1.45 0 5.62-1.63 12.51-4.89 6.89-3.26 12.82-4.66 17.8-4.22 13.62.97 24.28 5.76 31.98 14.38-11.89 7.15-17.7 17.06-17.43 29.74.27 10.06 4.15 18.52 11.64 25.37 7.49 6.86 16.48 10.74 26.97 11.64-2.18 6.64-4.86 13.43-8.04 20.38zM119.22 33.15c0-7.38 2.66-14.42 7.98-21.12 5.32-6.7 11.98-11.08 19.98-13.14.74 4.19.62 8.43-.36 12.72-.98 4.29-3.11 8.71-6.39 13.26-3.28 4.55-7.14 7.95-11.58 10.2-4.44 2.25-8.31 3.55-11.61 3.9-.27-1.92-.02-3.86.74-5.82z"></path>
</svg>
<span class="font-title-md text-title-md font-medium tracking-tight">Apple로 로그인</span>

<!-- Soft Horizontal Divider -->
<div class="relative flex items-center justify-center my-space-lg w-full">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-[1px] bg-outline-variant/35"></div>

<span class="relative px-4 bg-surface text-outline font-label-md text-label-md">
        또는
      </span>
</div>

<span>이메일로 시작하기</span>
</button>

<span>로그인 없이 둘러보기</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</button>
</div>
<!-- Legal Compliance & Terms Footer -->
<div class="mt-space-xl text-center px-4">
<p class="font-label-sm text-label-sm text-outline leading-relaxed">
        계속 진행함으로써 DocuAI의 
        <a class="underline underline-offset-2 hover:text-primary transition-colors" href="#terms">이용약관</a> 및 
        <a class="underline underline-offset-2 hover:text-primary transition-colors" href="#privacy">개인정보처리방침</a>에 
        동의하게 됩니다.
      </p>
</div>
</div>
<!-- Micro-Feedback Toast Notification Container -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 pointer-events-none transition-all duration-300 z-50 px-5 py-3 rounded-full bg-inverse-surface text-inverse-on-surface font-body-sm text-body-sm shadow-xl flex items-center gap-2" id="toastNotification">
<span class="material-symbols-outlined text-primary-fixed text-[18px]">info</span>
<span id="toastMessage">안전하게 계정 연동을 준비 중입니다...</span>
</div>
</div>
<script>
  (function() {
    const toast = document.getElementById('toastNotification');
    const toastMsg = document.getElementById('toastMessage');
    let toastTimeout = null;

    function showToast(message) {
      if (!toast || !toastMsg) return;
      toastMsg.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    const googleBtn = document.getElementById('googleLoginBtn');
    const appleBtn = document.getElementById('appleLoginBtn');
    const emailBtn = document.getElementById('emailLoginBtn');
    const guestBtn = document.getElementById('guestDemoBtn');

    if (googleBtn) {
      googleBtn.addEventListener('click', () => {
        showToast('Google 계정 인증 화면으로 이동합니다');
      });
    }

    if (appleBtn) {
      appleBtn.addEventListener('click', () => {
        showToast('Apple ID 생체 인증을 요청 중입니다');
      });
    }

    if (emailBtn) {
      emailBtn.addEventListener('click', () => {
        showToast('이메일 가입 및 로그인 화면을 엽니다');
      });
    }

    if (guestBtn) {
      guestBtn.addEventListener('click', () => {
        showToast('체험 모드로 즉시 문서를 분석할 수 있습니다');
      });
    }
  })();
</script></main></body></html>
